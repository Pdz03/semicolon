<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>V-Spesial Email</title>
</head>
<body style="margin:0; padding:0; background-color:#050816; background:#050816;">
  <div style="display:none; max-height:0; overflow:hidden; opacity:0; mso-hide:all;">
    {{preheader}}
  </div>
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="width:100%; border-collapse:collapse; background-color:#050816; background:#050816; margin:0; padding:0;">
    <tr>
      <td align="center" style="padding:32px 14px;">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="width:100%; max-width:680px; border-collapse:separate;">
          <tr>
            <td style="padding:0 0 18px 0; text-align:center; font-family:Georgia, 'Times New Roman', serif; font-size:12px; line-height:18px; letter-spacing:4px; text-transform:uppercase; color:#c4b5fd;">
              {{eyebrow}}
            </td>
          </tr>
          <tr>
            <td style="border:1px solid #1f2a44; border-radius:28px; background-color:#0b1226; background:#0b1226; box-shadow:0 18px 50px rgba(0,0,0,0.28); overflow:hidden;">
              <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="border-collapse:collapse;">
                <tr>
                  <td style="padding:42px 34px 18px 34px; font-family:Georgia, 'Times New Roman', serif; font-size:38px; line-height:46px; font-weight:700; color:#ffffff;">
                    {{title}}
                  </td>
                </tr>
                <tr>
                  <td style="padding:0 34px 0 34px; font-family:Georgia, 'Times New Roman', serif; font-size:19px; line-height:30px; color:#cbd5e1;">
                    {{greeting}}
                  </td>
                </tr>
                <tr>
                  <td style="padding:14px 34px 0 34px; font-family:Georgia, 'Times New Roman', serif; font-size:18px; line-height:30px; color:#cbd5e1;">
                    {{body}}
                  </td>
                </tr>
                <tr>
                  <td style="padding:28px 34px 0 34px;">
                    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="border-collapse:separate; border:1px solid #2d1d5f; border-radius:24px; background-color:#111936; background:#111936;">
                      <tr>
                        <td style="padding:24px 24px 10px 24px; font-family:Georgia, 'Times New Roman', serif; font-size:12px; line-height:18px; letter-spacing:3px; text-transform:uppercase; color:#c4b5fd;">
                          {{card_label}}
                        </td>
                      </tr>
                      <tr>
                        <td style="padding:0 24px 24px 24px;">
                          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="border-collapse:separate; border:1px solid #2f3a5b; border-radius:20px; background-color:#050816; background:#050816;">
                            <tr>
                              <td align="center" style="padding:18px 12px; font-family:Georgia, 'Times New Roman', serif; font-size:31px; line-height:40px; font-weight:700; letter-spacing:5px; color:#ffffff;">
                                {{code}}
                              </td>
                            </tr>
                          </table>
                        </td>
                      </tr>
                    </table>
                  </td>
                </tr>
                <tr>
                  <td style="padding:24px 34px 42px 34px; font-family:Georgia, 'Times New Roman', serif; font-size:17px; line-height:29px; color:#cbd5e1;">
                    {{footer}}
                  </td>
                </tr>
              </table>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
