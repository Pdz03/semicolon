<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scrapbook Ida</title>
  <meta name="description" content="Lembaran digital berisi pesan-pesan hangat, kenangan kecil, dan jalan menuju kejutan berikutnya." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="V-Spesial | Scrapbook Digital" />
  <meta property="og:description" content="Lembaran digital berisi pesan-pesan hangat, kenangan kecil, dan jalan menuju kejutan berikutnya." />
  <meta property="og:site_name" content="V-Spesial" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="V-Spesial | Scrapbook Digital" />
  <meta name="twitter:description" content="Lembaran digital berisi pesan-pesan hangat, kenangan kecil, dan jalan menuju kejutan berikutnya." />
  <link rel="icon" type="image/png" href="/images/logo.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
  <style>
    :root { color-scheme: dark; }
    body {
      background:
        radial-gradient(circle at top left, rgba(124, 58, 237, 0.28), transparent 30%),
        radial-gradient(circle at bottom right, rgba(59, 130, 246, 0.24), transparent 35%),
        #040612;
      font-family: Georgia, "Times New Roman", serif;
      overflow-x: hidden;
    }
    .heart {
      position: fixed;
      bottom: -40px;
      width: 18px;
      height: 18px;
      background: linear-gradient(135deg, rgba(244, 114, 182, 0.85), rgba(96, 165, 250, 0.7));
      transform: rotate(45deg);
      animation: floatUp linear infinite;
      opacity: 0.55;
      z-index: 0;
    }
    .heart::before, .heart::after {
      content: "";
      position: absolute;
      width: 18px;
      height: 18px;
      border-radius: 999px;
      background: inherit;
    }
    .heart::before { top: -9px; left: 0; }
    .heart::after { top: 0; left: -9px; }
    @keyframes floatUp {
      from { transform: translateY(0) rotate(45deg) scale(0.8); opacity: 0; }
      10% { opacity: 0.55; }
      to { transform: translateY(-120vh) rotate(45deg) scale(1.25); opacity: 0; }
    }
    .book-shell {
      perspective: 2200px;
    }
    .book-frame {
      position: relative;
      min-height: 38rem;
      border-radius: 2rem;
      background: linear-gradient(145deg, rgba(14, 20, 39, 0.98), rgba(10, 13, 29, 0.96));
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 30px 90px rgba(15, 23, 42, 0.5);
      overflow: hidden;
    }
    .page-sheet {
      position: absolute;
      inset: 0;
      transform-origin: left center;
      transform-style: preserve-3d;
      transition: transform 900ms cubic-bezier(0.22, 1, 0.36, 1), opacity 450ms ease;
    }
    .page-sheet.flipping {
      transform: rotateY(-170deg);
    }
    .page-sheet.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .page-face,
    .page-back {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      border-radius: 2rem;
      overflow: hidden;
    }
    .page-face {
      background: linear-gradient(180deg, rgba(253, 252, 255, 0.98), rgba(239, 241, 255, 0.94));
      color: #1f1640;
      display: grid;
      grid-template-columns: 1fr;
    }
    .page-back {
      transform: rotateY(180deg);
      background: linear-gradient(180deg, rgba(241, 233, 255, 0.98), rgba(228, 233, 255, 0.96));
    }
    .cover-page {
      background:
        linear-gradient(180deg, rgba(11, 14, 32, 0.20), rgba(11, 14, 32, 0.78)),
        var(--cover-image, linear-gradient(135deg, #1f1744, #0f172a));
      background-size: cover;
      background-position: center;
      color: #ffffff;
    }
    .closing-page {
      background:
        linear-gradient(180deg, rgba(11, 14, 32, 0.26), rgba(11, 14, 32, 0.82)),
        var(--closing-image, linear-gradient(135deg, #1f1744, #0f172a));
      background-size: cover;
      background-position: center;
      color: #ffffff;
    }
    .page-copy {
      padding: 2rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 1rem;
    }
    .paper-card {
      background: rgba(255, 255, 255, 0.62);
      border: 1px solid rgba(91, 33, 182, 0.12);
      box-shadow: 0 18px 40px rgba(91, 33, 182, 0.08);
      backdrop-filter: blur(8px);
    }
    .page-meta {
      letter-spacing: 0.35em;
      text-transform: uppercase;
      font-size: 0.72rem;
      color: rgba(91, 33, 182, 0.76);
    }
    .book-shadow {
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, rgba(7, 10, 24, 0.25), transparent 18%, transparent 82%, rgba(7, 10, 24, 0.18));
      pointer-events: none;
      z-index: 4;
    }
    .nav-btn[disabled] {
      opacity: 0.45;
      cursor: not-allowed;
    }
    .qr-heart-shell {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 18rem;
      height: 18rem;
      margin-inline: auto;
    }
    .qr-heart {
      position: relative;
      width: 11rem;
      height: 11rem;
      background: #ffffff;
      transform: rotate(-45deg);
      box-shadow: 0 0 60px rgba(168, 85, 247, 0.25);
    }
    .qr-heart::before,
    .qr-heart::after {
      content: "";
      position: absolute;
      width: 11rem;
      height: 5.5rem;
      background: #ffffff;
      border-radius: 5.5rem 5.5rem 0 0;
      z-index: 0;
    }
    .qr-heart::before {
      top: -5.45rem;
      left: 0;
    }
    .qr-heart::after {
      top: 2.75rem;
      left: 8rem;
      transform: rotate(90deg);
    }
    .qr-heart-inner {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1;
    }
    .qr-heart-inner canvas {
      width: 7.6rem;
      height: 7.6rem;
    }
    .qr-lobe {
      position: absolute;
      width: 9.5rem;
      height: 4.75rem;
      overflow: hidden;
      border-radius: 4.75rem 4.75rem 0 0;
      z-index: 1;
      pointer-events: none;
    }
    .qr-lobe--left {
      top: -4.65rem;
      left: 0.75rem;
    }
    .qr-lobe--right {
      top: 3.15rem;
      right: -7rem;
      transform: rotate(90deg);
      transform-origin: center;
    }
    .qr-lobe canvas {
      position: absolute;
      width: 6rem;
      height: 6rem;
      top: -1.35rem;
      left: -0.4rem;
      transform: rotate(45deg);
      opacity: 1;
    }
    @media (min-width: 768px) {
      .page-face {
        grid-template-columns: 1.02fr 0.98fr;
      }
      .page-copy {
        padding: 3rem;
      }
    }
  </style>
</head>
<body class="text-slate-100">
  <div id="hearts"></div>
  <main class="relative z-10 mx-auto max-w-6xl px-6 py-12">
    <header class="mb-10 text-center">
      <p class="text-sm uppercase tracking-[0.45em] text-violet-200/70">Scrapbook Digital</p>
      <h1 class="mt-4 text-4xl font-semibold md:text-6xl">Buka lembarannya satu per satu.</h1>
    </header>

    <section class="book-shell">
      <div class="book-frame">
        <div id="bookSheet" class="page-sheet">
          <div id="pageFront" class="page-face"></div>
          <div id="pageBack" class="page-back"></div>
        </div>
        <div class="book-shadow"></div>
      </div>
      <div class="mt-6 flex items-center justify-between gap-4">
        <button id="prevPage" class="nav-btn rounded-2xl border border-white/10 bg-white/5 px-5 py-3 text-sm font-medium text-white hover:bg-white/10">Sebelumnya</button>
        <div id="pageIndicator" class="text-sm uppercase tracking-[0.35em] text-violet-200/70">Lembar 01</div>
        <button id="nextPage" class="nav-btn rounded-2xl bg-gradient-to-r from-violet-500 to-blue-500 px-5 py-3 text-sm font-medium text-white hover:brightness-110">Selanjutnya</button>
      </div>
    </section>

    <section class="mt-16 rounded-[2rem] border border-violet-300/15 bg-slate-950/65 p-8 text-center shadow-2xl shadow-violet-950/40">
      <p class="text-sm uppercase tracking-[0.4em] text-violet-200/70">Gerbang Hadiah</p>
      <h2 class="mt-3 text-3xl font-semibold">Setelah lembar terakhir, lanjutkan ke sini</h2>
      <div class="mt-8 qr-heart-shell">
        <div class="qr-heart">
          <div class="qr-heart-inner">
            <div class="qr-lobe qr-lobe--left">
              <canvas id="qrLobeLeft"></canvas>
            </div>
            <div class="qr-lobe qr-lobe--right">
              <canvas id="qrLobeRight"></canvas>
            </div>
            <canvas id="qrCanvas"></canvas>
          </div>
        </div>
      </div>
      <form id="rewardForm" class="mx-auto mt-8 max-w-xl space-y-4">
        <label class="block text-left">
          <span class="mb-2 block text-sm text-slate-300">Masukkan kode dari QR ini untuk lanjut</span>
          <input id="rewardCode" type="text" class="w-full rounded-2xl border border-white/10 bg-white/5 px-4 py-3 text-white outline-none placeholder:text-slate-500 focus:border-violet-300/50" placeholder="Kode hadiah..." />
        </label>
        <button class="w-full rounded-2xl bg-gradient-to-r from-violet-500 to-blue-500 px-5 py-3 font-medium text-white hover:brightness-110">Buka Hadiah Virtual</button>
      </form>
      <div id="devRewardActions" class="mx-auto mt-6 hidden max-w-xl space-y-3">
        <div class="rounded-2xl border border-amber-300/20 bg-amber-400/10 px-4 py-3 text-sm text-amber-100">Mode dev aktif. Validasi kode reward dilewati.</div>
        <a href="/v-spesial/reward?akses=dev" class="block w-full rounded-2xl border border-white/10 px-5 py-3 font-medium text-white hover:bg-white/5">Lanjut langsung ke hadiah</a>
      </div>
      <p id="rewardMessage" class="mt-4 text-sm text-rose-300"></p>
    </section>
  </main>

  <script>
    const DEV_KEY = "v_spesial_dev_mode";
    const heartsHost = document.getElementById("hearts");
    for (let i = 0; i < 20; i += 1) {
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.style.left = `${Math.random() * 100}%`;
      heart.style.animationDuration = `${11 + Math.random() * 10}s`;
      heart.style.animationDelay = `${Math.random() * 8}s`;
      heartsHost.appendChild(heart);
    }

    const rewardMessage = document.getElementById("rewardMessage");
    const rewardForm = document.getElementById("rewardForm");
    const devRewardActions = document.getElementById("devRewardActions");
    const pageFront = document.getElementById("pageFront");
    const pageBack = document.getElementById("pageBack");
    const bookSheet = document.getElementById("bookSheet");
    const prevPage = document.getElementById("prevPage");
    const nextPage = document.getElementById("nextPage");
    const pageIndicator = document.getElementById("pageIndicator");
    const url = new URL(window.location.href);
    const akses = url.searchParams.get("akses");
    let isDevMode = false;
    let pages = [];
    let currentPage = 0;
    let isAnimating = false;

    function drawHeartQr(canvas, text, options = {}) {
      QRCode.toCanvas(canvas, text || "LOVE", {
        width: options.width || 220,
        margin: 1,
        color: {
          dark: options.dark || "#5b21b6",
          light: "#ffffff",
        },
      });
    }

    function drawLobeQr(canvas, text, options = {}) {
      QRCode.toCanvas(canvas, text || "LOVE", {
        width: options.width || 96,
        margin: 1,
        color: {
          dark: options.dark || "#5b21b6",
          light: "#ffffff",
        },
      });
    }

    function syncDevMode() {
      if (akses === "dev") {
        localStorage.setItem(DEV_KEY, "1");
      }
      isDevMode = localStorage.getItem(DEV_KEY) === "1";
      if (isDevMode) {
        rewardForm.classList.add("hidden");
        devRewardActions.classList.remove("hidden");
        rewardMessage.textContent = "Mode dev aktif.";
      }
    }

    function escapeHtml(value) {
      return String(value || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll("\"", "&quot;")
        .replaceAll("'", "&#39;");
    }

    function buildPageContent(page) {
      if (page.type === "cover") {
        return `
          <div class="page-face cover-page" style="--cover-image: linear-gradient(180deg, rgba(11, 14, 32, 0.20), rgba(11, 14, 32, 0.78)), url('${escapeHtml(page.image)}')">
            <div class="page-copy md:col-span-2 justify-end">
              <div class="max-w-3xl rounded-[1.75rem] border border-white/10 bg-black/25 p-6 backdrop-blur-md md:p-8">
                <div class="text-xs uppercase tracking-[0.45em] text-violet-100/70">Sampul</div>
                <h2 class="mt-4 text-3xl font-semibold md:text-5xl">${escapeHtml(page.title)}</h2>
                <p class="mt-4 max-w-2xl text-base leading-8 text-slate-100/85 md:text-lg">${escapeHtml(page.text)}</p>
              </div>
            </div>
          </div>
        `;
      }

      if (page.type === "closing") {
        return `
          <div class="page-face closing-page" style="--closing-image: linear-gradient(180deg, rgba(11, 14, 32, 0.26), rgba(11, 14, 32, 0.82)), url('${escapeHtml(page.image)}')">
            <div class="page-copy md:col-span-2 justify-end">
              <div class="max-w-3xl rounded-[1.75rem] border border-white/10 bg-black/30 p-6 backdrop-blur-md md:p-8">
                <div class="text-xs uppercase tracking-[0.45em] text-sky-100/70">Penutup</div>
                <p class="mt-4 text-lg leading-8 text-white md:text-2xl md:leading-10">${escapeHtml(page.text)}</p>
              </div>
            </div>
          </div>
        `;
      }

      return `
        <div class="page-face">
          <div class="page-copy">
            <div class="paper-card rounded-[1.75rem] p-6 md:p-8">
              <div class="page-meta">Lembar ${String(page.number).padStart(2, "0")}</div>
              <p class="mt-4 text-xl leading-9 md:text-2xl md:leading-10">${escapeHtml(page.text)}</p>
            </div>
          </div>
          <div class="hidden md:block bg-[radial-gradient(circle_at_top,_rgba(124,58,237,0.18),_transparent_32%),linear-gradient(160deg,rgba(255,255,255,0.62),rgba(226,232,255,0.9))]"></div>
        </div>
      `;
    }

    function buildBackContent(page) {
      return `
        <div class="h-full w-full bg-[linear-gradient(135deg,rgba(224,231,255,0.9),rgba(243,232,255,0.96))]"></div>
      `;
    }

    function renderCurrentPage() {
      const page = pages[currentPage];
      pageFront.innerHTML = buildPageContent(page);
      pageBack.innerHTML = buildBackContent(page);
      pageIndicator.textContent = `Lembar ${String(currentPage + 1).padStart(2, "0")} / ${String(pages.length).padStart(2, "0")}`;
      prevPage.disabled = currentPage === 0;
      nextPage.disabled = currentPage === pages.length - 1;
    }

    function goToPage(direction) {
      if (isAnimating) return;
      const target = currentPage + direction;
      if (target < 0 || target >= pages.length) return;

      isAnimating = true;
      bookSheet.classList.remove("hidden");
      bookSheet.classList.add("flipping");

      window.setTimeout(() => {
        currentPage = target;
        renderCurrentPage();
      }, 420);

      window.setTimeout(() => {
        bookSheet.classList.remove("flipping");
        isAnimating = false;
      }, 920);
    }

    async function loadScrapbook() {
      const response = await fetch("/api/v-bday/scrapbook");
      const data = await response.json();

      pages = [
        {
          type: "cover",
          image: data.scrapbook_photo_url || "https://placehold.co/1200x900/12091f/e9d5ff?text=Ida",
          title: data.scrapbook_title || "Scrapbook Spesial",
          text: data.scrapbook_intro_text || "Beberapa lembar kecil yang disimpan untuk dibuka perlahan.",
        },
        ...(data.notes || []).map((item, index) => ({
          type: "note",
          number: index + 1,
          text: item.notes || "",
        })),
        {
          type: "closing",
          image: data.scrapbook_outro_photo_url || data.scrapbook_photo_url || "https://placehold.co/1200x900/12091f/e9d5ff?text=Penutup",
          text: data.scrapbook_outro_text || "Terima kasih sudah membuka setiap lembarnya sampai akhir.",
        },
      ];

      renderCurrentPage();

      drawHeartQr(document.getElementById("qrCanvas"), data.reward_passcode || "", {
        width: 170,
        dark: "#4c1d95",
        light: "#ffffff",
      });
      drawLobeQr(document.getElementById("qrLobeLeft"), data.reward_passcode || "", {
        width: 170,
        dark: "#4c1d95",
        light: "#ffffff",
      });
      drawLobeQr(document.getElementById("qrLobeRight"), data.reward_passcode || "", {
        width: 170,
        dark: "#4c1d95",
        light: "#ffffff",
      });
    }

    prevPage.addEventListener("click", () => goToPage(-1));
    nextPage.addEventListener("click", () => goToPage(1));

    document.getElementById("rewardForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      rewardMessage.textContent = "";
      const code = document.getElementById("rewardCode").value.trim();
      const response = await fetch("/api/v-bday/validate-reward-passcode", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ code }),
      });
      const result = await response.json();
      if (result.success) {
        window.location.href = "/v-spesial/reward";
        return;
      }
      rewardMessage.textContent = "Kodenya belum cocok. Coba cek lagi QR-nya.";
    });

    syncDevMode();
    loadScrapbook().catch(() => {
      rewardMessage.textContent = "Gagal memuat scrapbook.";
    });
  </script>
</body>
</html>
