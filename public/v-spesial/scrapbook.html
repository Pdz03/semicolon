<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scrapbook Ida</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
  <style>
    :root { color-scheme: dark; }
    body {
      background:
        radial-gradient(circle at top left, rgba(124, 58, 237, 0.28), transparent 30%),
        radial-gradient(circle at bottom right, rgba(59, 130, 246, 0.24), transparent 35%),
        #040612;
      font-family: Georgia, "Times New Roman", serif;
      overflow-x: hidden;
    }
    .heart {
      position: fixed;
      bottom: -40px;
      width: 18px;
      height: 18px;
      background: linear-gradient(135deg, rgba(244, 114, 182, 0.85), rgba(96, 165, 250, 0.7));
      transform: rotate(45deg);
      animation: floatUp linear infinite;
      opacity: 0.55;
      z-index: 0;
    }
    .heart::before, .heart::after {
      content: "";
      position: absolute;
      width: 18px;
      height: 18px;
      border-radius: 999px;
      background: inherit;
    }
    .heart::before { top: -9px; left: 0; }
    .heart::after { top: 0; left: -9px; }
    @keyframes floatUp {
      from { transform: translateY(0) rotate(45deg) scale(0.8); opacity: 0; }
      10% { opacity: 0.55; }
      to { transform: translateY(-120vh) rotate(45deg) scale(1.25); opacity: 0; }
    }
    .glow-card {
      background: linear-gradient(180deg, rgba(15, 23, 42, 0.88), rgba(9, 12, 28, 0.94));
      border: 1px solid rgba(196, 181, 253, 0.18);
      box-shadow: 0 24px 60px rgba(15, 23, 42, 0.45), inset 0 0 0 1px rgba(255,255,255,0.02);
    }
    .reveal {
      opacity: 0;
      transform: translateY(35px);
      transition: opacity 0.8s ease, transform 0.8s ease;
    }
    .reveal.visible {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body class="text-slate-100">
  <div id="hearts"></div>
  <main class="relative z-10 mx-auto max-w-5xl px-6 py-12">
    <header class="mb-12 text-center">
      <p class="text-sm uppercase tracking-[0.45em] text-violet-200/70">Scrapbook Digital</p>
      <h1 class="mt-4 text-4xl font-semibold md:text-6xl">Untuk Ida, dengan semua kenangan kecil yang tetap tinggal.</h1>
    </header>

    <section class="mb-10 overflow-hidden rounded-[2rem] border border-white/10 bg-white/5">
      <img id="heroImage" src="" alt="Foto utama scrapbook" class="h-[24rem] w-full object-cover md:h-[34rem]" />
    </section>

    <section id="notesContainer" class="space-y-6"></section>

    <section class="mt-16 rounded-[2rem] border border-violet-300/15 bg-slate-950/65 p-8 text-center shadow-2xl shadow-violet-950/40">
      <p class="text-sm uppercase tracking-[0.4em] text-violet-200/70">Gerbang Hadiah</p>
      <h2 class="mt-3 text-3xl font-semibold">Scan cinta kecil ini</h2>
      <p class="mx-auto mt-4 max-w-2xl text-slate-300">QR ini menyimpan kode menuju halaman hadiah. Kalau bentuk matanya belum bisa jadi hati penuh, saya bungkus dengan frame romantis supaya tetap selaras dengan temanya.</p>
      <div class="mx-auto mt-8 flex h-72 w-72 items-center justify-center rounded-[2rem] border border-pink-300/25 bg-white p-6 shadow-[0_0_60px_rgba(168,85,247,0.25)]">
        <canvas id="qrCanvas"></canvas>
      </div>
      <form id="rewardForm" class="mx-auto mt-8 max-w-xl space-y-4">
        <label class="block text-left">
          <span class="mb-2 block text-sm text-slate-300">Masukkan kode dari QR ini untuk lanjut</span>
          <input id="rewardCode" type="text" class="w-full rounded-2xl border border-white/10 bg-white/5 px-4 py-3 text-white outline-none placeholder:text-slate-500 focus:border-violet-300/50" placeholder="Kode hadiah..." />
        </label>
        <button class="w-full rounded-2xl bg-gradient-to-r from-violet-500 to-blue-500 px-5 py-3 font-medium text-white hover:brightness-110">Buka Hadiah Virtual</button>
      </form>
      <p id="rewardMessage" class="mt-4 text-sm text-rose-300"></p>
    </section>
  </main>

  <script>
    const heartsHost = document.getElementById("hearts");
    for (let i = 0; i < 20; i += 1) {
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.style.left = `${Math.random() * 100}%`;
      heart.style.animationDuration = `${11 + Math.random() * 10}s`;
      heart.style.animationDelay = `${Math.random() * 8}s`;
      heartsHost.appendChild(heart);
    }

    const notesContainer = document.getElementById("notesContainer");
    const rewardMessage = document.getElementById("rewardMessage");
    let scrapbookData = [];

    async function loadScrapbook() {
      const response = await fetch("/api/v-bday/scrapbook");
      const data = await response.json();
      scrapbookData = data.notes || [];
      document.getElementById("heroImage").src = data.scrapbook_photo_url || "https://placehold.co/1200x900/12091f/e9d5ff?text=Ida";

      notesContainer.innerHTML = scrapbookData.map((item, index) => `
        <article class="glow-card reveal rounded-[2rem] p-8">
          <div class="text-sm uppercase tracking-[0.35em] text-sky-200/70">Lembar ${String(index + 1).padStart(2, "0")}</div>
          <p class="mt-4 text-xl leading-9 text-slate-100">${escapeHtml(item.notes || "")}</p>
        </article>
      `).join("");

      observeReveal();
      QRCode.toCanvas(document.getElementById("qrCanvas"), data.reward_passcode || "", {
        width: 220,
        margin: 1,
        color: { dark: "#3b0764", light: "#ffffff" },
      });
    }

    function observeReveal() {
      const observer = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) {
            entry.target.classList.add("visible");
            observer.unobserve(entry.target);
          }
        });
      }, { threshold: 0.18 });

      document.querySelectorAll(".reveal").forEach((element) => observer.observe(element));
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll("\"", "&quot;")
        .replaceAll("'", "&#39;");
    }

    document.getElementById("rewardForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      rewardMessage.textContent = "";
      const code = document.getElementById("rewardCode").value.trim();
      const response = await fetch("/api/v-bday/validate-reward-passcode", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ code }),
      });
      const result = await response.json();
      if (result.success) {
        window.location.href = "/v-spesial/reward";
        return;
      }
      rewardMessage.textContent = "Kodenya belum cocok. Coba cek lagi QR-nya.";
    });

    loadScrapbook().catch(() => {
      rewardMessage.textContent = "Gagal memuat scrapbook.";
    });
  </script>
</body>
</html>
