<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semicolon V3 - Admin Override</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'JetBrains Mono', monospace;
            background-color: #050505;
            color: #3fb950; /* Warna hijau hacker khas Semicolon */
        }
        .glitch { animation: glitch 1s infinite; }
        @keyframes glitch { 0%, 100% { opacity: 1; } 50% { opacity: 0.8; } }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-sm space-y-6 border border-green-800 p-6 bg-green-900/10 rounded-lg shadow-2xl">
        
        <div class="text-center border-b border-green-800 pb-4">
            <h1 class="text-xl font-bold text-green-500 glitch">> V3_ADMIN_TERMINAL</h1>
            <p class="text-[10px] text-gray-500 mt-1 uppercase">Metamorphosis Protocol</p>
        </div>

        <div class="space-y-4">
            <!-- Tampilan Target Waktu Saat Ini -->
            <div class="text-center p-3 bg-black border border-green-900 rounded">
                <p class="text-[10px] text-gray-500">CURRENT TARGET DATE:</p>
                <p id="current-time-display" class="text-xs text-green-400 mt-1 animate-pulse">Loading data...</p>
            </div>

            <!-- Form Update Waktu -->
            <div class="space-y-2">
                <label class="text-xs text-gray-400">SET NEW TARGET DATE:</label>
                <input type="datetime-local" id="time-picker" class="w-full bg-black border border-green-700 p-3 text-xs text-white rounded focus:outline-none focus:border-green-400">
            </div>

            <div class="space-y-2">
                <label class="text-xs text-gray-400">ADMIN PASSPHRASE:</label>
                <input type="password" id="admin-secret" placeholder="••••••••" class="w-full bg-black border border-green-700 p-3 text-center text-sm tracking-widest text-white rounded focus:outline-none focus:border-green-400">
            </div>

            <button onclick="updateV3Time()" id="btn-update" class="w-full bg-green-800 hover:bg-green-700 text-white font-bold py-3 rounded mt-2 transition">
                OVERRIDE PROTOCOL
            </button>
            
            <p id="status-msg" class="text-[10px] text-center mt-2 h-4"></p>
        </div>

        <div class="text-center pt-2">
            <a href="/v3" class="text-[10px] text-gray-500 hover:text-green-500 underline decoration-gray-600">>> Lihat Halaman Kupu-Kupu <<</a>
        </div>
    </div>

    <script>
        // Ambil waktu saat ini dari DB saat halaman dimuat
        window.onload = async () => {
            try {
                const res = await fetch('/api/v3/status');
                const data = await res.json();
                
                if (data.release_time) {
                    const d = new Date(data.release_time);
                    // Tampilkan format yang gampang dibaca
                    document.getElementById('current-time-display').innerText = d.toLocaleString('id-ID', { dateStyle: 'full', timeStyle: 'short' });
                    
                    // Set default value di picker (butuh penyesuaian Timezone agar pas di input datetime-local)
                    d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
                    document.getElementById('time-picker').value = d.toISOString().slice(0,16);
                }
            } catch (err) {
                document.getElementById('current-time-display').innerText = "Gagal mengambil data.";
                document.getElementById('current-time-display').classList.replace('text-green-400', 'text-red-500');
            }
        };

        // Fungsi Update Waktu
        async function updateV3Time() {
            const time = document.getElementById('time-picker').value;
            const secret = document.getElementById('admin-secret').value;
            const statusMsg = document.getElementById('status-msg');
            const btn = document.getElementById('btn-update');

            if (!time) {
                statusMsg.innerText = "❌ Waktu tidak boleh kosong!";
                statusMsg.className = "text-[10px] text-center mt-2 h-4 text-red-500";
                return;
            }

            btn.innerText = "UPDATING...";
            
            try {
                const res = await fetch('/api/v3/admin/update-time', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ new_time: time, secret: secret })
                });
                
                const data = await res.json();

                if (res.ok) {
                    statusMsg.innerText = "✅ " + data.message;
                    statusMsg.className = "text-[10px] text-center mt-2 h-4 text-green-400";
                    // Refresh current time display
                    const d = new Date(time);
                    document.getElementById('current-time-display').innerText = d.toLocaleString('id-ID', { dateStyle: 'full', timeStyle: 'short' });
                    document.getElementById('admin-secret').value = ''; // Kosongkan password
                } else {
                    statusMsg.innerText = "❌ " + data.error;
                    statusMsg.className = "text-[10px] text-center mt-2 h-4 text-red-500";
                }
            } catch (err) {
                statusMsg.innerText = "❌ Gagal koneksi ke server.";
                statusMsg.className = "text-[10px] text-center mt-2 h-4 text-red-500";
            }
            
            btn.innerText = "OVERRIDE PROTOCOL";
        }
    </script>
</body>
</html>
