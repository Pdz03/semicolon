<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Semicolon V4 - Player Tes Hubungan</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --purple: #9333ea;
      --bg: #0f172a;
    }
    body {
      font-family: "Outfit", sans-serif;
      background-color: var(--bg);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .glass-card {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
      border-radius: 1.5rem;
    }
    
    /* Custom Slider */
    input[type=range] {
      -webkit-appearance: none;
      width: 100%;
      background: transparent;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 36px;
      width: 36px;
      border-radius: 50%;
      background: #c084fc;
      cursor: pointer;
      margin-top: -14px;
      box-shadow: 0 0 15px rgba(192, 132, 252, 0.5);
      border: 3px solid #fff;
    }
    input[type=range]::-webkit-slider-runnable-track {
      width: 100%;
      height: 8px;
      cursor: pointer;
      background: #334155;
      border-radius: 4px;
    }
  </style>
</head>
<body class="p-5 relative">

  <!-- SCREEN 1: Pilih Pemain -->
  <div id="screen-select" class="flex-1 flex flex-col justify-center max-w-sm mx-auto w-full">
    <div class="glass-card p-8 text-center space-y-6 shadow-xl">
      <h2 class="text-2xl font-bold text-white mb-2">Siapa Kamu?</h2>
      <p class="text-slate-400 text-sm mb-6">Pilih profilmu untuk bergabung ke dalam *room*.</p>
      
      <button onclick="selectPlayer('p1')" class="w-full py-4 rounded-xl bg-blue-600 hover:bg-blue-500 font-bold text-white transition-colors shadow-lg shadow-blue-900/50">
        Fendi
      </button>
      <button onclick="selectPlayer('p2')" class="w-full py-4 rounded-xl bg-pink-600 hover:bg-pink-500 font-bold text-white transition-colors shadow-lg shadow-pink-900/50">
        Ida
      </button>
    </div>
  </div>

  <!-- SCREEN 2: Quiz -->
  <div id="screen-quiz" class="flex-1 flex flex-col max-w-sm mx-auto w-full hidden">
    <!-- Header -->
    <div class="flex justify-between items-center mb-6 pt-4">
      <div class="text-sm font-bold text-purple-400 tracking-widest uppercase" id="player-badge">PLAYER</div>
      <div class="px-3 py-1 bg-slate-800 rounded-full text-xs font-semibold text-slate-300" id="progress-text">1/10</div>
    </div>
    
    <!-- Question Card -->
    <div class="glass-card p-6 flex-1 flex flex-col justify-center mb-6 relative">
      <div class="absolute -top-4 left-6 text-5xl font-black text-slate-700/50">Q.</div>
      <h3 id="question-text" class="text-xl md:text-2xl font-medium leading-relaxed z-10 text-slate-100 text-center">Loading...</h3>
    </div>

    <!-- Controls -->
    <div class="glass-card p-6 mb-4">
      <div class="flex justify-between text-xs font-semibold text-slate-400 mb-4 px-1">
        <span>Sangat Rendah (1)</span>
        <span>Sangat Tinggi (5)</span>
      </div>
      <div class="mb-8">
        <input type="range" min="1" max="5" value="3" id="answer-slider" oninput="updateSliderValue(this.value)">
      </div>
      <div class="text-center mb-6">
        <span class="text-4xl font-black text-purple-400" id="slider-val">3</span>
      </div>
      <button onclick="submitAnswer()" class="w-full py-4 rounded-xl bg-purple-600 font-bold text-white shadow-lg shadow-purple-900/50 active:scale-95 transition-transform">
        Konfirmasi
      </button>
    </div>
  </div>

  <!-- SCREEN 3: Selesai -->
  <div id="screen-done" class="flex-1 flex flex-col justify-center max-w-sm mx-auto w-full hidden">
    <div class="glass-card p-8 text-center">
      <div class="w-20 h-20 bg-green-500/20 rounded-full flex items-center justify-center mx-auto mb-6">
        <svg class="w-10 h-10 text-green-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
        </svg>
      </div>
      <h2 class="text-2xl font-bold text-white mb-3">Selesai!</h2>
      <p class="text-slate-400 text-sm">Menunggu pasanganmu selesai menjawab. Silakan perhatikan layar monitor utama.</p>
    </div>
  </div>

  <script>
    const socket = io();
    const urlParams = new URLSearchParams(window.location.search);
    const roomId = urlParams.get('roomId');
    
    let playerId = null;
    let questions = [];
    let currentIndex = 0;

    if (!roomId) {
      alert("Room ID tidak ditemukan. Silakan scan ulang QR Code di monitor.");
    }

    function selectPlayer(id) {
      playerId = id;
      
      // Update UI Badge
      document.getElementById('player-badge').textContent = (id === 'p1') ? 'FENDI' : 'IDA';
      document.getElementById('player-badge').classList.add(id === 'p1' ? 'text-blue-400' : 'text-pink-400');
      document.getElementById('player-badge').classList.remove('text-purple-400');

      // Join Socket
      socket.emit('join-new-room', { roomId, role: 'player', playerId });

      // Switch Screen
      document.getElementById('screen-select').classList.add('hidden');
      document.getElementById('screen-quiz').classList.remove('hidden');

      // Fetch Questions
      fetch('/api/relationship-test/questions')
        .then(res => res.json())
        .then(data => {
          questions = data;
          showQuestion();
        });
    }

    function showQuestion() {
      if (currentIndex >= questions.length) {
        // Kuis Selesai
        document.getElementById('screen-quiz').classList.add('hidden');
        document.getElementById('screen-done').classList.remove('hidden');
        return;
      }

      const q = questions[currentIndex];
      document.getElementById('question-text').textContent = q.text;
      document.getElementById('progress-text').textContent = `${currentIndex + 1}/${questions.length}`;
      
      // Reset Slider
      document.getElementById('answer-slider').value = 3;
      updateSliderValue(3);
    }

    function updateSliderValue(val) {
      document.getElementById('slider-val').textContent = val;
    }

    function submitAnswer() {
      const score = parseInt(document.getElementById('answer-slider').value);
      const q = questions[currentIndex];
      
      socket.emit('submit-answer', {
        roomId,
        playerId,
        questionId: q.id,
        score: score
      });

      currentIndex++;
      showQuestion();
    }
  </script>
</body>
</html>
