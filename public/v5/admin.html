<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin V5</title><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet"><style>:root{--pink:#e85d8e;--ink:#3b2330;--muted:#806b75;--line:#f2cbd9}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);font-family:Outfit,sans-serif;background:radial-gradient(circle at 5% 0,#ffdce9,transparent 33%),linear-gradient(145deg,#fff,#fff7fa)}.wrap{width:min(100% - 32px,1000px);margin:auto}.panel{background:#fff;border:1px solid var(--line);border-radius:24px;padding:24px;margin:26px 0;box-shadow:0 16px 44px #9d4a6b10}.serif{font-family:"Playfair Display",serif}.top{padding:28px 0 0}.top h1{font-size:clamp(35px,7vw,56px);margin:12px 0 6px}.top p{color:var(--muted)}.eyebrow{color:var(--pink);font-size:12px;font-weight:700;letter-spacing:.3em;text-transform:uppercase}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.field{margin:15px 0}.label{display:block;font-weight:700;font-size:13px;margin-bottom:8px}.input{width:100%;border:1px solid var(--line);border-radius:13px;padding:13px 14px;font:inherit;color:var(--ink)}.hint{font-size:12px;color:var(--muted);margin:6px 0}.button{border:0;border-radius:13px;padding:13px 17px;background:var(--pink);color:#fff;font:inherit;font-weight:700;cursor:pointer}.secondary{background:#fff;color:var(--pink);border:1px solid var(--line)}.message{color:#9b3e62;min-height:22px;margin-top:12px}.login{max-width:430px;margin:90px auto}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:12px 8px;border-bottom:1px solid #f5e1e9;font-size:14px}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#fff0f6;color:#9b3e62;font-size:12px;font-weight:700}.logout{float:right}@media(max-width:700px){.grid{grid-template-columns:1fr}.table{font-size:12px}}</style></head><body><main class="wrap"><section id="login" class="panel login"><div class="eyebrow">Semicolon V5</div><h1 class="serif">Admin</h1><p>Atur akses dan waktu pembukaan event.</p><form id="loginForm"><input id="password" class="input" type="password" placeholder="Password admin" required><button class="button" style="width:100%;margin-top:12px">Masuk</button><div id="loginMessage" class="message"></div></form></section><section id="dashboard" hidden><header class="top"><button id="logout" class="button secondary logout">Keluar</button><div class="eyebrow">Semicolon V5 / Admin</div><h1 class="serif">Pengaturan event</h1><p>PIN disimpan sebagai hash. Kosongkan field PIN jika tidak ingin mengubahnya.</p></header><form id="configForm" class="panel"><div class="grid"><div class="field"><label class="label">Nama event</label><input id="eventName" class="input"></div><div class="field"><label class="label">PIN untuk Fendi</label><input id="fendiPin" class="input" inputmode="numeric" maxlength="6" placeholder="Tanggal lahir Ida — DDMMYY"><p class="hint" id="fendiHint"></p></div><div class="field"><label class="label">PIN untuk Ida</label><input id="idaPin" class="input" inputmode="numeric" maxlength="6" placeholder="Tanggal lahir Fendi — DDMMYY"><p class="hint" id="idaHint"></p></div><div class="field"><label class="label">Review History dibuka pada</label><input id="reviewTime" class="input" type="datetime-local"></div><div class="field"><label class="label">Math + Hide & Seek dibuka pada</label><input id="gameTime" class="input" type="datetime-local"></div></div><button class="button">Simpan pengaturan</button><div id="configMessage" class="message"></div></form><section class="panel"><h2 class="serif">Status Input History</h2><table class="table"><thead><tr><th>User</th><th>Poin</th><th>Status</th><th>Submit</th><th></th></tr></thead><tbody id="statusRows"></tbody></table></section></section></main><script>
var adminToken=localStorage.getItem("v5_admin_session");var login=document.getElementById("login");var dashboard=document.getElementById("dashboard");function request(url,options){options=options||{};options.headers=Object.assign({"Content-Type":"application/json","x-v5-admin-session":adminToken},options.headers||{});return fetch(url,options).then(function(r){return r.json().then(function(p){if(!r.ok)throw Error(p.message||"Permintaan gagal.");return p;});});}function localValue(value){if(!value)return"";var d=new Date(value);function pad(n){return String(n).padStart(2,"0");}return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+"T"+pad(d.getHours())+":"+pad(d.getMinutes());}function load(){return request("/api/v5/admin/config").then(function(p){document.getElementById("eventName").value=p.config.event_name||"Semicolon V5";document.getElementById("reviewTime").value=localValue(p.config.review_release_time);document.getElementById("gameTime").value=localValue(p.config.game_release_time);document.getElementById("fendiHint").textContent=p.has_fendi_pin?"PIN sudah diatur.":"PIN belum diatur.";document.getElementById("idaHint").textContent=p.has_ida_pin?"PIN sudah diatur.":"PIN belum diatur.";return request("/api/v5/admin/history-status");}).then(function(p){var rows=p.items.map(function(x){return"<tr><td>"+x.role[0].toUpperCase()+x.role.slice(1)+"</td><td>"+x.count+"</td><td><span class=\"badge\">"+x.history_status+"</span></td><td>"+(x.submitted_at?new Date(x.submitted_at).toLocaleString("id-ID"):"-")+"</td><td><button class=\"button secondary reset\" data-role=\""+x.role+"\" type=\"button\">Reset</button></td></tr>";}).join("");document.getElementById("statusRows").innerHTML=rows;document.querySelectorAll(".reset").forEach(function(button){button.onclick=function(){if(confirm("Reset status submit?"))request("/api/v5/admin/history-status/"+button.dataset.role+"/reset",{method:"POST",body:"{}"}).then(load);};});});}document.getElementById("loginForm").onsubmit=function(e){e.preventDefault();fetch("/api/v5/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:document.getElementById("password").value})}).then(function(r){return r.json().then(function(p){if(!r.ok)throw Error(p.message);return p;});}).then(function(p){adminToken=p.token;localStorage.setItem("v5_admin_session",adminToken);login.hidden=true;dashboard.hidden=false;load();}).catch(function(e){document.getElementById("loginMessage").textContent=e.message;});};document.getElementById("configForm").onsubmit=function(e){e.preventDefault();request("/api/v5/admin/config",{method:"PUT",body:JSON.stringify({event_name:document.getElementById("eventName").value,fendi_pin:document.getElementById("fendiPin").value,ida_pin:document.getElementById("idaPin").value,review_release_time:document.getElementById("reviewTime").value,game_release_time:document.getElementById("gameTime").value})}).then(function(){document.getElementById("configMessage").textContent="Pengaturan tersimpan.";document.getElementById("fendiPin").value="";document.getElementById("idaPin").value="";load();}).catch(function(e){document.getElementById("configMessage").textContent=e.message;});};document.getElementById("logout").onclick=function(){localStorage.removeItem("v5_admin_session");location.reload();};if(adminToken){login.hidden=true;dashboard.hidden=false;load().catch(function(){localStorage.removeItem("v5_admin_session");location.reload();});}
</script></body></html>
