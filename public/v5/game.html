<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Math + Hide & Seek</title><script src="https://unpkg.com/html5-qrcode"></script><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet"><style>:root{--pink:#e85d8e;--ink:#3b2330;--muted:#806b75;--line:#f2cbd9;--soft:#fff4f8}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);font-family:Outfit,sans-serif;background:radial-gradient(circle at 0 0,#ffdce9,transparent 34%),linear-gradient(145deg,#fff,#fff7fa)}.wrap{width:min(100% - 32px,720px);margin:auto;padding:28px 0}.back{color:var(--pink);text-decoration:none;font-weight:700}.panel{margin-top:22px;background:#fff;border:1px solid var(--line);border-radius:26px;padding:26px;box-shadow:0 18px 50px #9d4a6b12}.serif{font-family:"Playfair Display",serif}.panel h1{font-size:clamp(36px,8vw,58px);margin:8px 0}.muted{color:var(--muted);line-height:1.65}.status{padding:14px;border-radius:14px;background:var(--soft);color:#843b59;font-weight:600;margin:18px 0}.button{width:100%;border:0;border-radius:14px;padding:15px;background:var(--pink);color:#fff;font:inherit;font-weight:700;cursor:pointer}.button:disabled{opacity:.55;cursor:not-allowed}.secondary{margin-top:10px;background:#fff;color:var(--pink);border:1px solid var(--line)}.input{width:100%;border:1px solid var(--line);border-radius:14px;padding:14px;font:inherit;margin:12px 0}.hidden{display:none}.timer{font-family:"Playfair Display",serif;font-size:38px;font-weight:700;margin:14px 0}.reader{overflow:hidden;border-radius:18px;margin:14px 0}.variables{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}.variable{padding:12px;border-radius:14px;background:var(--soft);text-align:center}.variable strong{display:block;color:var(--pink);font-size:12px}.variable span{font-size:24px;font-weight:700}.question{font-family:"Playfair Display",serif;font-size:clamp(32px,8vw,52px);text-align:center;padding:25px 10px}.feedback{min-height:24px;color:#a63f65;font-weight:600}</style></head><body><main class="wrap"><a class="back" href="/v5/home.html">← Kembali ke menu</a><section class="panel"><div style="color:var(--pink);font-size:12px;font-weight:700;letter-spacing:.25em">MATH + HIDE & SEEK</div><h1 class="serif">Siap mencari?</h1><p class="muted">Tekan Start dari perangkat masing-masing. Timer dimulai setelah Fendi dan Ida sama-sama siap.</p><div class="status" id="status">Memuat status...</div><div class="timer hidden" id="timer">00:00:00</div><button class="button hidden" id="start">Start</button><div id="scanSection" class="hidden"><button class="button" id="camera">Buka kamera barcode</button><div class="reader hidden" id="reader"></div><p class="muted">Jika kamera sulit membaca barcode, masukkan angka yang tercetak di bawah barcode.</p><input class="input" id="manualCode" inputmode="numeric" placeholder="Masukkan kode barcode"><button class="button secondary" id="manualSubmit">Validasi barcode</button></div><div id="mathSection" class="hidden"><div class="variables" id="variables"></div><div class="muted" id="questionNumber"></div><div class="question"><span id="expression"></span> = <span id="target"></span></div><input class="input" id="answer" inputmode="numeric" placeholder="Jawaban"><button class="button" id="answerButton">Kirim jawaban</button><div class="feedback" id="feedback"></div></div><div id="sharedSection" class="hidden"><div class="variables" id="sharedVariables"></div><div class="question" id="sharedExpression"></div><p class="muted" id="sharedInstruction"></p><input class="input hidden" id="sharedAnswer" inputmode="numeric" placeholder="Jawaban bersama"><button class="button hidden" id="sharedButton">Kirim jawaban bersama</button><div class="feedback" id="sharedFeedback"></div></div></section></main><script>
const token=localStorage.getItem("v5_session");if(!token)location.href="/v5";const role=localStorage.getItem("v5_role");let state=null,scanner=null,scanning=false;function logout(){localStorage.removeItem("v5_session");localStorage.removeItem("v5_role");location.href="/v5"}async function api(url,opt={}){const response=await fetch(url,{...opt,headers:{"Content-Type":"application/json","x-v5-session":token,...(opt.headers||{})}});const payload=await response.json();if(response.status===401)return logout();if(!response.ok)throw Error(payload.message||"Permintaan gagal.");return payload}function elapsed(start,end){if(!start)return"00:00:00";const seconds=Math.max(0,Math.floor(((end?new Date(end).getTime():Date.now())-new Date(start).getTime())/1000)),hours=Math.floor(seconds/3600),minutes=Math.floor(seconds%3600/60);return`${String(hours).padStart(2,"0")}:${String(minutes).padStart(2,"0")}:${String(seconds%60).padStart(2,"0")}`}function variableHtml(values){return Object.entries(values||{}).map(([key,value])=>`<div class="variable"><strong>${key}</strong><span>${value}</span></div>`).join("")}function hideStages(){["scanSection","mathSection","sharedSection"].forEach(id=>document.querySelector(`#${id}`).classList.add("hidden"))}function render(){if(!state)return;const me=state.players[role],other=state.players[role==="fendi"?"ida":"fendi"],status=document.querySelector("#status"),start=document.querySelector("#start"),timer=document.querySelector("#timer");hideStages();if(!state.released){status.textContent=state.release_time?`Permainan dibuka ${new Date(state.release_time).toLocaleString("id-ID")}.`:"Timer permainan belum diatur admin.";return}if(!me.started){status.textContent="Kamu belum menekan Start.";start.classList.remove("hidden");return}start.classList.add("hidden");if(!state.started_at){status.textContent=other.started?"Keduanya siap. Menunggu permainan dimulai...":"Menunggu pasangan menekan Start.";return}timer.classList.remove("hidden");timer.textContent=elapsed(state.started_at,me.finished_at);if(state.shared.solved){status.textContent="Semua soal selesai. Kalian berhasil!";stopScanner();return}if(me.finished_at){if(!other.finished_at){status.textContent="Soal personal selesai. Menunggu pasangan menyelesaikan soal ke-4.";return}document.querySelector("#sharedSection").classList.remove("hidden");document.querySelector("#sharedVariables").innerHTML=variableHtml(state.variables);if(role==="ida"){status.textContent="Bacakan formula ini kepada Fendi.";document.querySelector("#sharedExpression").textContent=state.shared.expression;document.querySelector("#sharedInstruction").textContent="Gabungkan nilai variabel milikmu dengan variabel milik Fendi.";document.querySelector("#sharedAnswer").classList.add("hidden");document.querySelector("#sharedButton").classList.add("hidden")}else{status.textContent="Minta Ida membacakan formula, lalu masukkan jawabannya.";document.querySelector("#sharedExpression").textContent="Soal bersama ada di perangkat Ida";document.querySelector("#sharedInstruction").textContent="Gunakan nilai variabel kalian berdua.";document.querySelector("#sharedAnswer").classList.remove("hidden");document.querySelector("#sharedButton").classList.remove("hidden")}return}if(!me.barcode_scanned){status.textContent="Timer berjalan. Cari amplop, lalu scan barcode di dalamnya.";document.querySelector("#scanSection").classList.remove("hidden");return}stopScanner();status.textContent=`Soal ${state.current_question.number} dari 4`;document.querySelector("#mathSection").classList.remove("hidden");document.querySelector("#variables").innerHTML=variableHtml(state.variables);document.querySelector("#questionNumber").textContent=`Cari nilai variabel ${state.current_question.target}`;document.querySelector("#expression").textContent=state.current_question.expression;document.querySelector("#target").textContent=state.current_question.target}async function refresh(){try{const payload=await api("/api/v5/game/status");if(payload){state=payload.state;render()}}catch(error){document.querySelector("#status").textContent=error.message}}document.querySelector("#start").onclick=async()=>{try{state=(await api("/api/v5/game/start",{method:"POST",body:"{}"})).state;render()}catch(error){alert(error.message)}};async function submitCode(code){if(!code)return;try{state=(await api("/api/v5/game/scan",{method:"POST",body:JSON.stringify({code})})).state;render()}catch(error){alert(error.message)}}document.querySelector("#manualSubmit").onclick=()=>submitCode(document.querySelector("#manualCode").value.trim());document.querySelector("#answerButton").onclick=async()=>{try{state=(await api("/api/v5/game/answer",{method:"POST",body:JSON.stringify({answer:document.querySelector("#answer").value})})).state;document.querySelector("#answer").value="";document.querySelector("#feedback").textContent="Jawaban benar.";render()}catch(error){document.querySelector("#feedback").textContent=error.message}};document.querySelector("#sharedButton").onclick=async()=>{try{state=(await api("/api/v5/game/shared-answer",{method:"POST",body:JSON.stringify({answer:document.querySelector("#sharedAnswer").value})})).state;document.querySelector("#sharedFeedback").textContent="Jawaban bersama benar!";render()}catch(error){document.querySelector("#sharedFeedback").textContent=error.message}};document.querySelector("#camera").onclick=async()=>{if(scanning)return stopScanner();document.querySelector("#reader").classList.remove("hidden");scanner=new Html5Qrcode("reader");try{await scanner.start({facingMode:"environment"},{fps:10,qrbox:{width:260,height:150}},async code=>{await stopScanner();submitCode(code)});scanning=true;document.querySelector("#camera").textContent="Tutup kamera"}catch(error){alert("Kamera tidak dapat dibuka. Gunakan input manual.")}};async function stopScanner(){if(scanner&&scanning){await scanner.stop().catch(()=>{});scanner.clear();scanning=false;document.querySelector("#reader").classList.add("hidden");document.querySelector("#camera").textContent="Buka kamera barcode"}}refresh();setInterval(refresh,2000);setInterval(render,1000);
</script></body></html>
