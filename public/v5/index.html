<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Semicolon V5</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--pink:#e85d8e;--deep:#6f2948;--ink:#3b2330;--muted:#806b75;--soft:#fff4f8;--line:#f2cbd9}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);font-family:Outfit,sans-serif;background:radial-gradient(circle at 10% 0,#ffdce9,transparent 34%),radial-gradient(circle at 100% 20%,#ffeaf2,transparent 32%),linear-gradient(145deg,#fff,#fff7fa)}.wrap{width:min(100% - 32px,960px);margin:auto}.panel{background:rgba(255,255,255,.88);border:1px solid rgba(255,255,255,.9);box-shadow:0 22px 70px #9d4a6b1c;border-radius:28px}.hero{margin-top:32px;padding:40px;text-align:center}.eyebrow{color:var(--pink);font-size:12px;font-weight:700;letter-spacing:.3em;text-transform:uppercase}.serif{font-family:"Playfair Display",serif}.hero h1{font-size:clamp(38px,8vw,66px);line-height:1.05;margin:14px 0}.hero p{color:var(--muted);max-width:560px;margin:auto;line-height:1.7}.roles{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:24px}.role{border:1px solid var(--line);background:#fff;border-radius:22px;padding:26px;text-align:left;cursor:pointer;color:var(--ink);font:inherit;transition:.2s}.role:hover{transform:translateY(-3px);border-color:var(--pink);box-shadow:0 12px 28px #d65c851c}.role strong{display:block;font-family:"Playfair Display",serif;font-size:28px}.role span{display:block;color:var(--muted);margin-top:5px}.form{display:none;margin-top:20px;padding:24px;text-align:left}.form.show{display:block}.label{display:block;font-size:13px;font-weight:700;margin-bottom:8px}.input{width:100%;border:1px solid var(--line);border-radius:14px;padding:14px 16px;font:inherit;color:var(--ink);outline:none}.input:focus{border-color:var(--pink);box-shadow:0 0 0 4px #e85d8e18}.button{border:0;border-radius:14px;padding:14px 18px;background:var(--pink);color:white;font:inherit;font-weight:700;cursor:pointer}.button:disabled{opacity:.55;cursor:wait}.message{min-height:24px;color:#b23b63;font-size:14px;margin-top:12px}@media(max-width:600px){.hero{padding:28px 20px}.roles{grid-template-columns:1fr}}
</style></head>
<body><main class="wrap"><section class="panel hero"><div class="eyebrow">Semicolon V5</div><h1 class="serif">Satu tahun, banyak cerita.</h1><p>Pilih namamu untuk melanjutkan perjalanan kecil ini.</p><div class="roles"><button class="role" data-role="fendi"><strong>Fendi</strong><span>Masuk sebagai Fendi</span></button><button class="role" data-role="ida"><strong>Ida</strong><span>Masuk sebagai Ida</span></button></div><form id="loginForm" class="panel form"><label id="pinLabel" class="label" for="pin">PIN akses</label><input id="pin" class="input" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" placeholder="DDMMYY" required><div style="display:flex;gap:10px;align-items:center;margin-top:14px"><button class="button" type="submit">Masuk</button><button class="button" type="button" id="back" style="background:#fff;color:var(--pink);border:1px solid var(--line)">Ganti role</button></div><div id="message" class="message"></div></form></section></main><script>
let selectedRole="";const form=document.querySelector("#loginForm");const pin=document.querySelector("#pin");const message=document.querySelector("#message");document.querySelectorAll("[data-role]").forEach(btn=>btn.onclick=()=>{selectedRole=btn.dataset.role;document.querySelector("#pinLabel").textContent=`PIN untuk ${selectedRole[0].toUpperCase()+selectedRole.slice(1)} (tanggal lahir pasangan)`;form.classList.add("show");pin.focus();message.textContent=""});document.querySelector("#back").onclick=()=>{selectedRole="";form.classList.remove("show");pin.value=""};form.onsubmit=async e=>{e.preventDefault();message.textContent="Memeriksa PIN...";try{const r=await fetch("/api/v5/auth",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({role:selectedRole,pin:pin.value})});const p=await r.json();if(!r.ok)throw Error(p.message);localStorage.setItem("v5_session",p.token);localStorage.setItem("v5_role",p.role);location.href="/v5/home.html"}catch(err){message.textContent=err.message||"Login gagal."}};
</script></body></html>
