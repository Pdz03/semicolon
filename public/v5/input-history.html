<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Input History - Semicolon V5</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet"><style>:root{--pink:#e85d8e;--ink:#3b2330;--muted:#806b75;--line:#f2cbd9}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);font-family:Outfit,sans-serif;background:radial-gradient(circle at 5% 0,#ffdce9,transparent 33%),linear-gradient(145deg,#fff,#fff7fa)}.wrap{width:min(100% - 32px,820px);margin:auto}.top{padding:30px 0 18px}.back{color:var(--pink);text-decoration:none;font-weight:700;font-size:14px}.serif{font-family:"Playfair Display",serif}.top h1{font-size:clamp(34px,7vw,54px);margin:16px 0 8px}.top p{color:var(--muted);line-height:1.6}.status{padding:15px 18px;border-radius:16px;background:#fff0f6;color:#7f3858;font-size:14px;margin:18px 0}.item{background:#fff;border:1px solid var(--line);border-radius:22px;padding:20px;margin:14px 0;box-shadow:0 12px 34px #9d4a6b10}.item-head{display:flex;justify-content:space-between;align-items:center;color:#b45778;font-size:13px;font-weight:700}.textarea{width:100%;min-height:130px;resize:vertical;border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px;font:inherit;color:var(--ink);outline:none}.textarea:focus{border-color:var(--pink);box-shadow:0 0 0 4px #e85d8e18}.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:12px}.button{border:0;border-radius:12px;padding:11px 15px;background:var(--pink);color:white;font:inherit;font-weight:700;cursor:pointer}.secondary{background:#fff;color:var(--pink);border:1px solid var(--line)}.danger{color:#ae4568;background:#fff0f5}.preview{max-width:180px;max-height:140px;border-radius:12px;display:block;margin-top:12px;object-fit:cover}.add{width:100%;border:1px dashed #df8eab;border-radius:16px;padding:16px;background:#fff8fb;color:var(--pink);font:inherit;font-weight:700;cursor:pointer}.submit{width:100%;margin:20px 0 40px;padding:16px}.empty{text-align:center;color:var(--muted);padding:30px}</style></head><body><main class="wrap"><header class="top"><a class="back" href="/v5/home.html">← Kembali ke menu</a><h1 class="serif">Input History</h1><p>Tulis hal-hal yang berubah dalam dirimu selama satu tahun ini. Satu card adalah satu poin cerita.</p></header><div class="status" id="status">Memuat...</div><section id="list"></section><button class="add" id="add">+ Tambah poin</button><button class="button submit" id="submit">Submit Input History</button></main><script>
const token=localStorage.getItem("v5_session");if(!token)location.href="/v5";const headers={"x-v5-session":token,"Content-Type":"application/json"};let items=[];const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));async function api(url,opt={}){const r=await fetch(url,{...opt,headers:{...headers,...(opt.headers||{})}});const p=await r.json().catch(()=>({}));if(!r.ok)throw Error(p.message||"Permintaan gagal.");return p}function render(){const list=document.querySelector("#list");if(!items.length){list.innerHTML='<div class="empty">Belum ada poin. Mulai dari satu cerita kecil.</div>';return}list.innerHTML=items.map((x,i)=>`<article class="item" data-id="${x.id}"><div class="item-head"><span>Poin ${i+1}</span><span>${x.updated_at?new Date(x.updated_at).toLocaleDateString("id-ID"):""}</span></div><textarea class="textarea">${esc(x.content)}</textarea>${x.image_url?`<img class="preview" src="${esc(x.image_url)}" alt="Lampiran poin ${i+1}">`:""}<div class="actions"><button class="button save">Simpan teks</button><label class="button secondary">Upload gambar<input class="file" type="file" accept="image/*" hidden></label><button class="button danger delete">Hapus</button></div></article>`).join("");document.querySelectorAll(".save").forEach(b=>b.onclick=()=>save(b.closest(".item")));document.querySelectorAll(".delete").forEach(b=>b.onclick=()=>remove(b.closest(".item")));document.querySelectorAll(".file").forEach(f=>f.onchange=()=>upload(f.closest(".item"),f.files[0]))}async function load(){try{const p=await api("/api/v5/history");items=p.items;const s=await api("/api/v5/session");document.querySelector("#status").textContent=`Status: ${s.participant.history_status === "submitted"?"Sudah submit — perubahan berikutnya perlu submit ulang.":"Belum submit"}`;render()}catch(e){document.querySelector("#status").textContent=e.message}}async function save(card){try{const id=card.dataset.id;const p=await api(id?`/api/v5/history/${id}`:"/api/v5/history",{method:id?"PUT":"POST",body:JSON.stringify({content:card.querySelector("textarea").value})});if(id)items=items.map(x=>x.id===p.item.id?p.item:x);else items.push(p.item);render()}catch(e){alert(e.message)}}async function remove(card){if(!confirm("Hapus poin ini?"))return;try{await api(`/api/v5/history/${card.dataset.id}`,{method:"DELETE"});await load()}catch(e){alert(e.message)}}async function upload(card,file){if(!file)return;const data=new FormData();data.append("file",file);try{const r=await fetch(`/api/v5/history/${card.dataset.id}/image`,{method:"POST",headers:{"x-v5-session":token},body:data});const p=await r.json();if(!r.ok)throw Error(p.message);items=items.map(x=>x.id===p.item.id?p.item:x);render()}catch(e){alert(e.message)}}document.querySelector("#add").onclick=()=>{const card=document.createElement("article");card.className="item";card.innerHTML="<div class=\"item-head\"><span>Poin baru</span></div><textarea class=\"textarea\" placeholder=\"Tulis perubahan atau cerita kamu...\"></textarea><div class=\"actions\"><button class=\"button save\">Simpan poin</button><button class=\"button secondary cancel\">Batal</button></div>";document.querySelector("#list").appendChild(card);card.querySelector(".save").onclick=()=>save(card);card.querySelector(".cancel").onclick=()=>card.remove();card.querySelector("textarea").focus()};document.querySelector("#submit").onclick=async()=>{try{await api("/api/v5/history/submit",{method:"POST",body:"{}"});await load();alert("Input History berhasil disubmit.")}catch(e){alert(e.message)}};load();
</script></body></html>
