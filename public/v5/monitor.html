<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Monitor V5</title><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet"><style>:root{--pink:#e85d8e;--ink:#321f28;--muted:#806b75;--line:#f2cbd9}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);font-family:Outfit,sans-serif;background:radial-gradient(circle at 5% 0,#ffdce9,transparent 30%),radial-gradient(circle at 100% 100%,#ffeaf2,transparent 34%),#fffafc}.wrap{width:min(100% - 48px,1250px);margin:auto;padding:36px 0}.eyebrow{color:var(--pink);font-size:13px;font-weight:700;letter-spacing:.32em}.serif{font-family:"Playfair Display",serif}h1{font-size:clamp(42px,7vw,78px);margin:10px 0}.lead{color:var(--muted);font-size:20px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:24px;margin-top:32px}.player{background:#fff;border:1px solid var(--line);border-radius:30px;padding:34px;box-shadow:0 22px 70px #9d4a6b12}.player h2{font-family:"Playfair Display",serif;font-size:42px;margin:0}.timer{font-size:clamp(46px,7vw,82px);font-weight:700;letter-spacing:.04em;margin:24px 0}.status{display:inline-block;border-radius:999px;padding:9px 14px;background:#fff0f6;color:#8f3c5b;font-weight:700}.waiting{margin-top:28px;padding:18px;border-radius:18px;background:#fff0f6;color:#7e3a56;text-align:center;font-size:18px}@media(max-width:760px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="eyebrow">SEMICOLON V5 / LIVE MONITOR</div><h1 class="serif">Math + Hide & Seek</h1><p class="lead">Timer dimulai saat kedua pemain menekan Start.</p><div class="waiting" id="global">Memuat status permainan...</div><section class="grid"><article class="player"><h2>Fendi</h2><div class="timer" id="fendiTimer">00:00:00</div><span class="status" id="fendiStatus">Belum siap</span></article><article class="player"><h2>Ida</h2><div class="timer" id="idaTimer">00:00:00</div><span class="status" id="idaStatus">Belum siap</span></article></section></main><script>
let state=null;function elapsed(value,end){if(!value)return"00:00:00";const seconds=Math.floor(((end?new Date(end).getTime():Date.now())-new Date(value).getTime())/1000),hours=Math.floor(seconds/3600),minutes=Math.floor(seconds%3600/60);return`${String(hours).padStart(2,"0")}:${String(minutes).padStart(2,"0")}:${String(seconds%60).padStart(2,"0")}`}function playerStatus(player){if(player.finished_at)return"Soal personal selesai";if(player.barcode_scanned)return`Mengerjakan soal ${Math.min(player.question_index+1,4)}/4`;if(state.started_at)return"Sedang mencari barcode";if(player.started)return"Sudah menekan Start";return"Belum menekan Start"}function render(){if(!state)return;document.querySelector("#fendiTimer").textContent=elapsed(state.started_at,state.players.fendi.finished_at);document.querySelector("#idaTimer").textContent=elapsed(state.started_at,state.players.ida.finished_at);document.querySelector("#fendiStatus").textContent=playerStatus(state.players.fendi);document.querySelector("#idaStatus").textContent=playerStatus(state.players.ida);document.querySelector("#global").textContent=!state.released?"Permainan masih terkunci oleh timer.":state.shared_solved?"Permainan selesai.":state.started_at?"Permainan sedang berlangsung.":"Menunggu Fendi dan Ida menekan Start."}async function refresh(){try{const response=await fetch("/api/v5/game/monitor");const payload=await response.json();state=payload.state;render()}catch(error){document.querySelector("#global").textContent="Monitor kehilangan koneksi ke server."}}refresh();setInterval(refresh,2000);setInterval(render,1000);
</script></body></html>
