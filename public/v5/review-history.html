<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Review History - Semicolon V5</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet"><style>:root{--pink:#e85d8e;--deep:#6f2948;--ink:#3b2330;--muted:#806b75;--soft:#fff4f8;--line:#f2cbd9}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);font-family:Outfit,sans-serif;background:radial-gradient(circle at 5% 0,#ffdce9,transparent 33%),radial-gradient(circle at 100% 35%,#fff0f5,transparent 30%),linear-gradient(145deg,#fff,#fff7fa)}.wrap{width:min(100% - 32px,850px);margin:auto}.top{padding:30px 0 18px}.back{color:var(--pink);text-decoration:none;font-weight:700;font-size:14px}.eyebrow{margin-top:24px;color:var(--pink);font-size:12px;font-weight:700;letter-spacing:.3em;text-transform:uppercase}.serif{font-family:"Playfair Display",serif}.top h1{font-size:clamp(36px,7vw,58px);margin:10px 0}.top p{color:var(--muted);line-height:1.7}.lock,.empty{background:#fff;border:1px solid var(--line);border-radius:24px;padding:34px;text-align:center;box-shadow:0 16px 44px #9d4a6b10}.lock strong{display:block;font-family:"Playfair Display",serif;font-size:28px;margin-bottom:10px}.lock p,.empty{color:var(--muted)}.history{display:grid;gap:18px;padding-bottom:50px}.item{background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:24px;padding:24px;box-shadow:0 16px 44px #9d4a6b10}.number{color:var(--pink);font-size:12px;font-weight:700;letter-spacing:.22em;text-transform:uppercase}.content{font-family:"Playfair Display",serif;font-size:clamp(22px,4vw,30px);line-height:1.5;white-space:pre-wrap;margin:14px 0 0}.photo{display:block;width:100%;max-height:540px;object-fit:cover;border-radius:18px;margin-top:20px;background:var(--soft);cursor:zoom-in}.date{margin-top:16px;color:var(--muted);font-size:12px}.modal{position:fixed;inset:0;background:#341724e8;display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.modal.show{display:flex}.modal img{max-width:95vw;max-height:90vh;border-radius:16px}.modal button{position:absolute;top:18px;right:18px;border:0;border-radius:999px;background:#fff;color:var(--deep);width:42px;height:42px;font-size:22px;cursor:pointer}</style></head><body><main class="wrap"><header class="top"><a class="back" id="backLink" href="/v5/home.html">← Kembali ke menu</a><div class="eyebrow">Review History</div><h1 class="serif">Cerita dari <span id="partner">pasanganmu</span>.</h1><p>Hal-hal yang berubah, dirasakan, dan ingin disimpan selama satu tahun perjalanan ini.</p></header><section id="content"><div class="lock"><strong>Memuat cerita...</strong><p>Tunggu sebentar.</p></div></section></main><div class="modal" id="modal"><button aria-label="Tutup foto">×</button><img alt="Foto history"></div><script>
const params=new URLSearchParams(location.search),previewRole=params.get("preview"),isPreview=["fendi","ida"].includes(previewRole);const token=isPreview?localStorage.getItem("v5_admin_session"):localStorage.getItem("v5_session");if(!token)location.href=isPreview?"/v5/admin":"/v5";if(isPreview){document.querySelector("#backLink").href="/v5/admin";document.querySelector("#backLink").textContent="← Kembali ke admin";document.querySelector(".eyebrow").textContent="Preview Review History"}const esc=value=>String(value??"").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[char]));function logout(){localStorage.removeItem("v5_session");localStorage.removeItem("v5_role");location.href="/v5"}async function load(){try{const endpoint=isPreview?`/api/v5/admin/review?viewer=${previewRole}`:"/api/v5/review";const response=await fetch(endpoint,{headers:isPreview?{"x-v5-admin-session":token}:{"x-v5-session":token}});const payload=await response.json();if(response.status===401){if(isPreview){localStorage.removeItem("v5_admin_session");location.href="/v5/admin";return}return logout();}if(!response.ok)throw Error(payload.message||"Gagal memuat Review History.");if(!payload.unlocked){document.querySelector("#content").innerHTML=`<div class="lock"><strong>Masih terkunci</strong><p>${esc(payload.reason)}</p></div>`;return}const partner=payload.partner_role[0].toUpperCase()+payload.partner_role.slice(1);document.querySelector("#partner").textContent=partner;if(!payload.items.length){document.querySelector("#content").innerHTML='<div class="empty">Belum ada history untuk ditampilkan.</div>';return}document.querySelector("#content").innerHTML=`<div class="history">${payload.items.map((item,index)=>`<article class="item"><div class="number">Cerita ${index+1}</div><div class="content">${esc(item.content)}</div>${item.image_url?`<img class="photo" src="${esc(item.image_url)}" alt="Foto cerita ${index+1}">`:""}<div class="date">Diperbarui ${new Date(item.updated_at).toLocaleDateString("id-ID",{day:"numeric",month:"long",year:"numeric"})}</div></article>`).join("")}</div>`;document.querySelectorAll(".photo").forEach(image=>image.onclick=()=>openPhoto(image.src))}catch(error){document.querySelector("#content").innerHTML=`<div class="lock"><strong>Belum bisa dibuka</strong><p>${esc(error.message)}</p></div>`}}const modal=document.querySelector("#modal");function openPhoto(src){modal.querySelector("img").src=src;modal.classList.add("show")}function closePhoto(){modal.classList.remove("show");modal.querySelector("img").src=""}modal.querySelector("button").onclick=closePhoto;modal.onclick=event=>{if(event.target===modal)closePhoto()};load();
</script></body></html>
